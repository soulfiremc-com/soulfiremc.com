name: "Build and Test"

on:
  - push
  - pull_request

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and Test

    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun ci

      - name: Install Python for SDK documentation checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install Java for plugin documentation checks
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Use the latest SoulFire SDK release
        run: bun run sync-sdk-version && bun run generate-node-reference && bun run generate-sdk-code

      - name: Run typecheck
        run: bun run typecheck

      - name: Run check
        run: bun run check

      - name: Check documentation links, references, and examples
        run: bun run check-docs

      - name: Run tests
        run: bun run test

      - name: Build website and upload source maps
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY || '' }}
        run: bun run build

      - name: Test concurrent provider rendering in Workers runtime
        env:
          PROVIDER_WORKER_BUNDLE: .cloudflare/output/v0/workers/default/bundle
        run: bunx tsx --test tests/provider-worker.test.ts

      - name: Deploy production to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CF_SEND_TELEMETRY: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf deploy --prebuilt

      - name: Upload a preview version to Cloudflare
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          CF_SEND_TELEMETRY: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf workers versions create --prebuilt
