name: "Build and Test"

on:
  - push
  - pull_request

jobs:
  test:
    name: Build and Test

    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Install Python for SDK documentation checks
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Java for plugin documentation checks
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Run typecheck
        run: bun run typecheck

      - name: Run check
        run: bun run check

      - name: Check documentation links, references, and examples
        run: bun run check-docs

      - name: Run tests
        run: bun run test

      - name: Build website and upload source maps
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY || '' }}
        run: bun run build

      - name: Test concurrent provider rendering in Workers runtime
        env:
          PROVIDER_WORKER_BUNDLE: .cloudflare/output/v0/workers/default/bundle
        run: bunx tsx --test tests/provider-worker.test.ts
