name: "Build and Test"

on:
  - push
  - pull_request

jobs:
  test:
    name: Build and Test

    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Install Python for SDK documentation checks
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Java for plugin documentation checks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Run typecheck
        run: bun run typecheck

      - name: Run check
        run: bun run check

      - name: Check documentation links, references, and examples
        run: bun run check-docs

      - name: Run tests
        run: bun run test
